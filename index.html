<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product section</title>
    <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
 <!-- navegation -->
  <div class="top-nav">
    <div class="container top-nav-links">
      <a href="#">SAVE MORE ON APP</a>
      <a href="#">BECOME A SELLER</a>
      <a href="#">HELP & SUPPORT</a>
      <a href="#">LOGIN</a>
      <a href="#">SIGN UP</a>
      </div>
  </div>

 <!--Search Header-->
  <header class="search-header">
    <div class="container header-content">
      <div class="logo">
        <a href="#">Daraz</a>
      </div>
      <div class="search-box">
        <input type="text" placeholder="Search in Daraz">
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <div class="cart-icon">
        <i class="fa-solid fa-cart-shopping"></i>
      </div>
    </div>
  </header>



<main class="container">
<!-- Banner Section -->
    <section class="hero-section">
      <div class="hero-banner">
        
        <div class="banner-text">
        <h1>GLOBAL DEALS</h1>
          <h2>Direct From China</h2>
          <div class="voucher-badge">
            <span>%</span> International Vouchers
          </div>
          <a href="#" class="shop-btn">Shop Now</a>
        </div>
   
       
<div class="slider-container">
  <!-- Radio Buttons -->
  <input type="radio" name="slider" id="slide1" checked>
  <input type="radio" name="slider" id="slide2">
  <input type="radio" name="slider" id="slide3">
  <input type="radio" name="slider" id="slide4">
  <input type="radio" name="slider" id="slide5">


  <!-- Images -->
  <div class="slides">
    <div class="slide img1"><img src="https://i0.wp.com/www.smartprix.com/bytes/wp-content/uploads/2022/10/Web-Hero-Banner_Womenswear_06102022_MB_U289.gif?ssl=1" width="30px" height="50px"></div>
    <div class="slide img2"><img src="https://miro.medium.com/v2/resize:fit:1358/1*Fg-Qcmyxj4XbV6iRCy6Bcg.png" alt="Image 2"></div>
    <div class="slide img3"><img src="https://tse2.mm.bing.net/th/id/OIP.wM3_WwEGJOtOzypl11TcIgHaD4?r=0&w=1200&h=630&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Image 3"></div>
    <div class="slide img4"><img src="https://tse3.mm.bing.net/th/id/OIP.yVVdWg0bBHYLdbpADuQdagHaEK?r=0&w=960&h=540&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Image 4"></div>
    <div class="slide img5"><img src="https://img.lazcdn.com/us/domino/a8e16c9a-c4e0-41c1-a5d7-1bed9222b244_PK-1976-688.jpg_2200x2200q80.jpg" alt="Image 5"></div>
  </div>

  <!-- < arrows -->
  <div class="prev-arrows">
    <label for="slide5" class="arrow prev p1">&lt;</label>
    <label for="slide1" class="arrow prev p2">&lt;</label>
    <label for="slide2" class="arrow prev p3">&lt;</label>
    <label for="slide3" class="arrow prev p4">&lt;</label>
    <label for="slide4" class="arrow prev p5">&lt;</label>
  </div>

  <!-- > arrows -->
  <div class="next-arrows">
    <label for="slide3" class="arrow next n1">&gt;</label>
    <label for="slide4" class="arrow next n2">&gt;</label>
    <label for="slide5" class="arrow next n3">&gt;</label>
     <label for="slide1" class="arrow next n4">&gt;</label>
      <label for="slide2" class="arrow next n5">&gt;</label>
  </div>

  <!-- Dots -->
  <div class="dots">
    <label for="slide1" class="dot"></label>
    <label for="slide2" class="dot"></label>
    <label for="slide3" class="dot"></label>
    <label for="slide4" class="dot"></label>
    <label for="slide5" class="dot"></label>
  </div>
</div>
      </div>


      <div class="app-card">
        <h3>TRY DARAZ APP</h3>
        <p class="rating">⭐ 4.8 Rated</p>
        <p class="download-title">Download the App now</p>
        <div class="app-features">
          <p>🚚 Free Shipping</p>
          <p>🎟️ Exclusive Vouchers</p>
        </div>
        <div class="qr-section">
          <img src="https://tse3.mm.bing.net/th/id/OIP.gBgKS70FWfcVYQEvPSHUeAHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" width="70px" height="70px"></br></br>
          <p>QR code</p>
          <div class="store-buttons">
            <button><i class="fa-solid fa-apple-whole"></i>  App Store</button>
            <button><i class="fa-brands fa-google-play"></i>  Google Play</button>
          </div>
        </div>
        <span class="subtext">Download the App Now!</span>
      </div>
      </section>
    </main>






    
</body>
</html>
